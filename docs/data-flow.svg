<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="1000" height="770" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">HaraBhara: how data flows</text>

  <!-- data pack -->
  <rect x="40" y="50" width="300" height="50" rx="8" fill="#fff4d6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="190" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Data pack (Excel files)</text>
  <text x="190" y="90" text-anchor="middle" font-size="12" fill="#444">sales, stock, weather, prices, purchases</text>

  <!-- nightly job -->
  <rect x="20" y="125" width="960" height="175" rx="12" fill="#eef4ff" stroke="#4a76c9" stroke-width="1.5"/>
  <text x="960" y="148" text-anchor="end" font-size="13" font-weight="bold" fill="#2a4f99">NIGHTLY JOB: runs every evening (Cloud Scheduler, 19:30 IST)</text>

  <g font-size="12" fill="#222" text-anchor="middle">
    <rect x="40"  y="165" width="118" height="85" rx="8" fill="#fff" stroke="#4a76c9"/>
    <text x="99"  y="190" font-weight="bold">1. Clean</text><text x="99" y="208">remove duplicates,</text><text x="99" y="224">fix blanks, flag</text><text x="99" y="240">outages</text>

    <rect x="172" y="165" width="118" height="85" rx="8" fill="#fff" stroke="#4a76c9"/>
    <text x="231" y="190" font-weight="bold">2. Hidden demand</text><text x="231" y="208">estimate sales lost</text><text x="231" y="224">on sold-out days</text>

    <rect x="304" y="165" width="118" height="85" rx="8" fill="#fff" stroke="#4a76c9"/>
    <text x="363" y="190" font-weight="bold">3. Features</text><text x="363" y="208">weekday, weather,</text><text x="363" y="224">festival, price,</text><text x="363" y="240">recent sales</text>

    <rect x="436" y="165" width="118" height="85" rx="8" fill="#e3f6e6" stroke="#3a9a4c" stroke-width="2"/>
    <text x="495" y="190" font-weight="bold">4. Forecast</text><text x="495" y="208">CatBoost model:</text><text x="495" y="224">low / likely / high</text><text x="495" y="240">for next 1-3 days</text>

    <rect x="568" y="165" width="118" height="85" rx="8" fill="#fff" stroke="#4a76c9"/>
    <text x="627" y="190" font-weight="bold">5. Suggest</text><text x="627" y="208">order, markdown,</text><text x="627" y="224">transfer, surplus</text><text x="627" y="240">buyer</text>

    <rect x="700" y="165" width="118" height="85" rx="8" fill="#fde8e8" stroke="#c94a4a" stroke-width="2"/>
    <text x="759" y="190" font-weight="bold">6. Rules check</text><text x="759" y="208">guardrails block</text><text x="759" y="224">anything not</text><text x="759" y="240">allowed</text>

    <rect x="832" y="165" width="118" height="85" rx="8" fill="#fff" stroke="#4a76c9"/>
    <text x="891" y="190" font-weight="bold">7. Reason + save</text><text x="891" y="208">one sentence each,</text><text x="891" y="224">write result files</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M99 100 L99 165"/>
    <path d="M158 207 L172 207"/><path d="M290 207 L304 207"/><path d="M422 207 L436 207"/>
    <path d="M554 207 L568 207"/><path d="M686 207 L700 207"/><path d="M818 207 L832 207"/>
  </g>

  <!-- firestore -->
  <rect x="380" y="370" width="240" height="70" rx="10" fill="#fff4d6" stroke="#c9a227" stroke-width="2"/>
  <text x="500" y="397" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Firestore (database)</text>
  <text x="500" y="416" text-anchor="middle" font-size="12" fill="#444">suggestions, approvals, audit log,</text>
  <text x="500" y="430" text-anchor="middle" font-size="12" fill="#444">outcomes, kill switch</text>
  <path d="M891 250 L891 405 L620 405" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="900" y="330" font-size="12" fill="#444">loaded as</text>
  <text x="900" y="346" font-size="12" fill="#444">"proposed"</text>

  <!-- planned feedback -->
  <path d="M497 370 L497 250" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#g)"/>
  <text x="488" y="318" text-anchor="end" font-size="12" font-style="italic" fill="#777">planned, not built:</text>
  <text x="488" y="334" text-anchor="end" font-size="12" font-style="italic" fill="#777">outcomes feed the</text>
  <text x="488" y="350" text-anchor="end" font-size="12" font-style="italic" fill="#777">next forecast</text>

  <!-- API -->
  <rect x="380" y="500" width="240" height="70" rx="10" fill="#e8f0ff" stroke="#4a76c9" stroke-width="2"/>
  <text x="500" y="527" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">API (FastAPI, Cloud Run)</text>
  <text x="500" y="546" text-anchor="middle" font-size="12" fill="#444">PIN login, role checks,</text>
  <text x="500" y="560" text-anchor="middle" font-size="12" fill="#444">deadlines, approval rules</text>
  <path d="M500 440 L500 500" stroke="#444" stroke-width="1.5" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="512" y="475" font-size="12" fill="#444">read / save</text>

  <!-- app -->
  <rect x="380" y="640" width="240" height="80" rx="10" fill="#e3f6e6" stroke="#3a9a4c" stroke-width="2"/>
  <text x="500" y="668" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Web app on a phone</text>
  <text x="500" y="687" text-anchor="middle" font-size="12" fill="#444">React screens, one per role:</text>
  <text x="500" y="702" text-anchor="middle" font-size="12" fill="#444">pictures, big tick / cross buttons</text>
  <path d="M440 570 L440 640" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M560 640 L560 570" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="430" y="610" text-anchor="end" font-size="12" fill="#444">suggestions + reasons</text>
  <text x="570" y="610" font-size="12" fill="#444">approve / edit / reject,</text>
  <text x="570" y="625" font-size="12" fill="#444">sold, wasted, ran out</text>

  <!-- people -->
  <rect x="720" y="640" width="240" height="80" rx="10" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="840" y="668" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">People decide</text>
  <text x="840" y="687" text-anchor="middle" font-size="12" fill="#444">store manager, area manager,</text>
  <text x="840" y="702" text-anchor="middle" font-size="12" fill="#444">DC lead, farmer coordinator</text>
  <path d="M720 680 L620 680" stroke="#444" stroke-width="1.5" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>

  <text x="500" y="752" text-anchor="middle" font-size="12" font-style="italic" fill="#666">Nothing happens until a person approves. Every action is written to the audit log.</text>
</svg>
